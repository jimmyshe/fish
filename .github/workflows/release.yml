name: Build and Release

on:
  push:
    tags:
      - 'v*'         # 客户端发布
      - 'server-v*'  # 后端镜像发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 客户端打包：仅 v* tag
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 构建期注入客户端所需的服务器信息（ADR 0004；非秘密，存 repo variables）
          POCKET_ID_ISSUER: ${{ vars.POCKET_ID_ISSUER }}
          FISH_OIDC_CLIENT_ID: ${{ vars.FISH_OIDC_CLIENT_ID }}
          FISH_API_RESOURCE: ${{ vars.FISH_API_RESOURCE }}
          FISH_API_BASE_URL: ${{ vars.FISH_API_BASE_URL }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run dist -- --win --publish always
          else
            npm run dist -- --linux --publish always
          fi
        shell: bash

  # server Docker 镜像 → GHCR（ADR 0004；手动部署）：仅 server-v* tag
  server-image:
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验 tag 版本与 pyproject.toml 一致并导出镜像版本
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#server-v}"
          PY_VERSION=$(grep -m1 '^version' server/pyproject.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pyproject.toml 的 version $PY_VERSION 不一致，先 bump"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
        shell: bash

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fish-server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fish-server:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/fish-server:latest
